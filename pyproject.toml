[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.0.7"
description = "A small, explainable CLI coding agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=2.0.0,<3.0.0",
  "prompt-toolkit>=3.0.50,<4.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "rich>=14.0.0,<15.0.0",
]

[project.scripts]
agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/proposals"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
